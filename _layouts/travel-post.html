
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | STMPoh12 Travel</title>
  <style>
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      line-height: 1.8;
      color: #e5e7eb;
      background: #101820;
    }
    a { color: #7dd3fc; }
    h1, h2, h3 { line-height: 1.3; }
    .meta { color: #a7f3d0; }
    article { margin-top: 32px; }
  </style>
</head>
<body>
  <p><a href="{{ '/travel.html' | relative_url }}">← All Travel Stories</a></p>

  <h1>{{ page.title }}</h1>

  <p class="meta">
    {{ page.destination }} · {{ page.date | date: "%d %B %Y" }}
  </p>

  <article>
    {{ content }}
  </article>

  <hr>
  <p><a href="{{ '/' | relative_url }}">Back to STMPoh12 Home</a></p>
</body>
</html>
